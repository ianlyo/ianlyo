# ──────────────────────────────────────────────────────────────
# Health Debug - app config
# Empty URL ("") = "not set yet" (the site shows a disabled button).
# ──────────────────────────────────────────────────────────────
name: Health Debug
packageName: com.lnu.healthdebug
icon: /apps/health-debug/app-icon.png
status: closed-beta                          # closed-beta | open-beta | released | coming-soon | paused
version: "2.2.2"                             # versionCode 14
minAndroid: "7.1"                            # API 25 (per Play Console); Health Connect is built in from Android 14
targetAndroid: "16"                          # Target SDK 36

tagline:
  zh: 為開發與測試而生，輕鬆模擬並寫入 Android Health Connect 健康數據。
  en: Mock and inject structured health data into Android Health Connect.
description:
  zh: |
    Health Debug 是以 Jetpack Compose 與 Material Design 3 打造的 Android 開發測試工具，可輕鬆模擬並寫入結構完整的健康與運動數據到 Android Health Connect。
    支援所有版本的 Health Connect：Android 13 以下的獨立 APK，到 Android 14+ 內建的 Framework（最高 API 36 / Android 16）。
    所有資料都只寫入裝置本機的 Health Connect，不會蒐集、上傳或分享。
  en: |
    Health Debug is an Android development and testing tool built with Jetpack Compose and Material Design 3. It lets you easily mock and inject highly structured health and fitness data into Android Health Connect.
    It supports every Health Connect version, from the standalone APK on Android 13 and lower to the framework built into Android 14+ (up to API 36 / Android 16).
    All data is written to the on-device Health Connect store. Nothing is collected, uploaded or shared.

features:
  - title: { zh: 設定時間與配速, en: Set Duration and Pace }
    image: /apps/health-debug/live.png
    video: /apps/health-debug/vid/live-recording.mp4
    description:
      zh: 即時記錄模式可自訂時、分、秒與每分鐘步數配速，隨時開始模擬健走或跑步。
      en: In Live Recording, set hours, minutes, seconds and steps-per-minute pace, then start simulating a walk or run.
  - title: { zh: 即時模擬運動數據, en: Live Session Stats }
    image: /apps/health-debug/recording.png
    video: /apps/health-debug/vid/live-recording-2timing.mp4
    description:
      zh: 錄製中即時顯示剩餘時間、步數、距離、速度、配速與卡路里，並自動計算分段與速度變化。
      en: See remaining time, steps, distance, speed, pace and kcal update live, with segments and speed fluctuation calculated automatically.
  - title: { zh: 支援 Live Update 即時更新, en: Live Update Notifications }
    zoom: true
    video: /apps/health-debug/vid/live-notification.mp4
    images:
      - /apps/health-debug/live-update.jpg
      - /apps/health-debug/live-update-expand.png
    description:
      zh: 透過 Android 16 最新的 Live Update 即時更新功能，以 ProgressStyle 顯示步數、距離與卡路里。即使離開 App，狀態列與通知中心也會持續追蹤最新進度。
      en: Powered by Android 16's latest Live Update and ProgressStyle APIs to display steps, distance, and calories live. Progress stays visible across the status bar and notification shade even after leaving the app.
  - title: { zh: 歷史資料直接寫入, en: Direct Historical Write }
    image: /apps/health-debug/write.png
    description:
      zh: 選擇健走、跑步或自行車，依步數與配速手動寫入過去的運動記錄，寫入前先預覽距離、速度與卡路里。
      en: Pick walking, running or cycling and inject past sessions from step count and pace, previewing distance, speed and kcal before writing.
  - title: { zh: 檢視健康數據紀錄, en: Browse Health Records }
    image: /apps/health-debug/records.png
    description:
      zh: 依時間範圍、來源 App 與資料類型檢視步數、距離、卡路里與心率，快速驗證寫入結果。
      en: Filter by time range, source app and data type to verify the steps, distance, calories and heart rate you wrote.
  - title: { zh: 無縫寫入 Health Connect, en: Seamless Health Connect Sync }
    image: /apps/health-debug/googlefit.png
    description:
      zh: 將模擬的運動、心率與距離等數據精準寫入 Health Connect 原生資料庫。任何支援該平台的應用程式（如 Google Fit）皆能即時讀取並顯示，輕鬆驗證您 App 的跨應用資料流。
      en: Accurately inject simulated workouts, heart rate, and distance directly into the Health Connect native store. Any supported app (such as Google Fit) can read and visualize them instantly, making it effortless to verify your cross-app data pipeline.

