faq:
  - q: { zh: 我需要什麼才能參加測試？, en: What do I need to join the beta? }
    a:
      zh: 一個 Google 帳號（與 Google Play 商店相同），以及 Android 7.1（API 25）以上的裝置。Android 13 以下需另外安裝 Health Connect。
      en: A Google account (the same one used for the Play Store) and a device running Android 7.1 (API 25) or higher. Android 13 and lower also need the Health Connect app.
  - q: { zh: 這個 App 會蒐集我的資料嗎？, en: Does the app collect my data? }
    a:
      zh: 不會。所有資料只寫入裝置本機的 Health Connect，不會上傳或分享。詳情請參閱隱私權政策。
      en: No. All data is written to the on-device Health Connect store and never uploaded or shared. See the privacy policy for details.

