faq:
  - q: { zh: 沒有 Root 權限也可以使用嗎？一般模式與 Shizuku 差在哪？, en: Can I use OmniInstaller without Root? How do Standard and Shizuku differ? }
    a:
      zh: 可以。一般模式使用 Android 原生 PackageInstaller.Session API，完全免 Root 即可安裝 APK 與 Split 複合包；若透過無線除錯啟用免 Root 的 Shizuku，則可進一步實現不跳出系統確認視窗的背景靜默批次安裝。
      en: Yes. Standard mode uses Android's native PackageInstaller.Session API without Root to install APKs and split bundles. Pairing with rootless Shizuku via Wireless Debugging unlocks silent background batch installs without tapping confirmation prompts.
  - q: { zh: 支援 Android 14+ 安裝舊版 Target SDK 的 APK 嗎？, en: Does it support bypassing Android 14+ low target SDK blocks? }
    a:
      zh: 在 Root（libsu）模式下支援透過 --bypass-low-target-sdk-block 參數繞過 Android 14+ 的低 Target SDK 安裝限制，並支援 -d 降級與 -i com.android.vending 偽裝安裝來源。
      en: Yes, in Root (libsu) mode, OmniInstaller supports bypassing Android 14+ low target SDK restrictions via --bypass-low-target-sdk-block, along with -d downgrade installs and -i com.android.vending installer spoofing.
  - q: { zh: 從通訊軟體或檔案管理器同時分享多個 APK 會怎麼處理？, en: What happens when sharing multiple APK files via Android ShareSheet? }
    a:
      zh: OmniInstaller 的半透明浮動接收器（ShareReceiverActivity）會透過 ShareIntentResolver 自動判斷內容類型：複合包會合併剖析分包，而多個獨立 .apk 檔案則會智慧排入「循序多應用批次佇列」逐一安裝，不會誤認成單一應用的 Split 分包。
      en: "The translucent ShareReceiverActivity uses ShareIntentResolver to classify shares: archives are parsed as split bundles, while multiple standalone .apk files are queued sequentially as independent app installs rather than erroneously merged into one split session."
  - q: { zh: 如何在 Android 11+ 自動安裝含有 OBB 資料的 XAPK？, en: How are OBB expansion files in XAPK bundles handled on Android 11+? }
    a:
      zh: ObbInstaller 會自動解析壓縮檔內的 .obb 並部署至 /Android/obb/<package_name>/；若系統受分區儲存限制，在取得 MANAGE_EXTERNAL_STORAGE 或 Root（libsu）權限時將自動完成寫入。
      en: ObbInstaller extracts embedded .obb files to /Android/obb/<package_name>/. On Android 11+ scoped storage devices, it handles placement cleanly using MANAGE_EXTERNAL_STORAGE or automatic Root (libsu) shell fallback.

