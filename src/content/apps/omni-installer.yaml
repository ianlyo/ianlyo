name: OmniInstaller
packageName: com.lnu.omniinstallerapk
icon: /apps/omni-installer/app-icon.webp
status: closed-beta
version: "1.2.0"
minAndroid: "8.0"                            # minSdk 26
targetAndroid: "16"                          # targetSdk 36

tagline:
  zh: 專為 Android 打造的現代化、全格式應用程式安裝與批次管理工具。
  en: A modern, full-format Android package installer and batch manager.
description:
  zh: |
    OmniInstaller 是一款基於 Kotlin、Jetpack Compose 與 Material 3 Expressive 設計語言開發的 Android 應用程式安裝與批次管理工具。
    完整支援單一 APK 與各類拆分包格式（.apk、.apks、.apkm、.xapk、.zip），透過串流讀取 ZIP 標頭自動依 CPU 架構與螢幕密度過濾相容 Split APK，並自動將 .obb 擴充資料部署至 /Android/obb/（Android 11+ 支援 Root 回退寫入）。
    提供一般（免 Root）、Shizuku 及 Root（libsu）三大安裝引擎與即時權限檢測面板，搭配雙向系統 ShareSheet、不中斷原 App 返回堆疊的半透明浮動接收底欄、7 種多邊形變形動態元件與高併發儲存空間掃描器，打造流暢且完全離線隱私的 Android 套件管理體驗。
  en: |
    OmniInstaller is a modern Android package installer and batch manager crafted with Kotlin, Jetpack Compose, and Material 3 Expressive design.
    It supports standalone APKs and split bundle formats (.apk, .apks, .apkm, .xapk, .zip), inspects ZIP headers via streaming without full pre-extraction to filter compatible split APKs by ABI and density, and extracts .obb expansion assets to /Android/obb/ (with Root fallback on Android 11+).
    Featuring Standard (rootless), Shizuku, and Root (libsu) installation engines with a live permission inspector, two-way ShareSheet integration with a translucent floating bottom-sheet receiver, 7-polygon expressive shape morphing, and concurrent storage scanning, it delivers a fast, 100% offline package management experience.

features:
  - title: { zh: 全格式與 Split APK 智慧合併, en: Multi-Format & Smart Split Merging }
    description:
      zh: 支援 .apk、.apks、.apkm、.xapk 與 .zip。免完整解壓即可串流讀取 manifest.json / info.json，依裝置 CPU 架構與像素密度過濾相容分包，並標記 Base、ABI、Density、Language 與 Feature 標籤。
      en: Installs .apk, .apks, .apkm, .xapk, and .zip bundles. Streams ZIP manifests (manifest.json / info.json) without full extraction, filters splits by device ABI and density, and labels entries with Base, ABI, Density, Language, and Feature badges.
  - title: { zh: 智慧 OBB 自動掛載與部署, en: Smart OBB Auto-Mounting & Extraction }
    description:
      zh: 安裝 XAPK / 複合包時自動識別內含的 .obb 遊戲擴充資源並部署至 /Android/obb/<package_name>/；針對 Android 11+ 分區儲存限制，可搭配 Root（libsu）權限自動完成寫入。
      en: Automatically detects embedded .obb expansion files inside XAPK/archive bundles and extracts them to /Android/obb/<package_name>/, seamlessly falling back to Root (libsu) shell writes on Android 11+ scoped storage.
  - title: { zh: 三大安裝引擎與即時權限檢測, en: Three Install Engines & Live Permission Inspector }
    description:
      zh: 提供一般模式（原生 PackageInstaller.Session）、Shizuku 模式（免 Root ADB Shell 靜默安裝）與 Root 模式（libsu 支援 -d 降級、-t 測試包、-i 來源偽裝與繞過 Android 14+ 低 Target SDK 限制），並內建下拉即時刷新權限檢測頁面。
      en: Switch between Standard (native PackageInstaller.Session), Shizuku (silent rootless ADB Shell installs), and Root (libsu supporting -d downgrade, -t test packages, -i installer spoofing, and Android 14+ low target SDK bypass), backed by a pull-to-refresh live Permission Inspector.
  - title: { zh: 雙向 ShareSheet 與半透明浮動接收器, en: Two-Way ShareSheet & Floating Receiver }
    description:
      zh: 接收外部分享（ACTION_VIEW / ACTION_SEND / ACTION_SEND_MULTIPLE）時以半透明浮動底欄覆蓋於來源 App 上而不破壞返回堆疊，並智慧區分單包、複合包與「多應用循序批次佇列」；同時支援透過 FileProvider 與 Rich Preview 卡片對外分享 APK。
      en: Overlays any sending app with a translucent floating bottom sheet without disrupting task backstacks, smartly routing incoming shares into SingleApk, ArchiveBundle, or sequential BatchQueue flows—and exports packages outward via FileProvider with Android 10+ ClipData rich previews.
  - title: { zh: Material 3 Expressive 動態介面與配色, en: Material 3 Expressive UI, Motion & Theming }
    description:
      zh: 基於 graphics-shapes 打造 7 種多邊形平滑變形載入動畫（SoftBurst 至 Oval），整合官方 M3 MotionTokens 彈簧時間曲線與觸覺震動回饋，支援 Material You 動態取色及松柏綠、海洋藍、赤陶棕、黃銅芥末、暮色水蜜桃 5 款配色。
      en: Features a custom 7-polygon morphing indicator powered by graphics-shapes, official M3 MotionTokens spring curves and haptics, Android 12+ Material You Dynamic Color, and 5 curated palettes (Pine Green, Ocean Blue, Terracotta Brown, Brass Mustard, and Twilight Peach).
  - title: { zh: 高併發掃描、排序篩選與批次佇列, en: Concurrent Scanner, Filtering & Batch Queue }
    description:
      zh: 透過 Coroutine + Flow 非同步掃描本機檔案，支援依全部／未安裝／已安裝篩選與名稱／大小／狀態排序；規格詳情頁支援一鍵複製包名與路徑、降級警示開關、自動略過相同版本及安裝後自動清理來源檔。
      en: Asynchronous storage scanner with instant filtering (All / Uninstalled / Installed) and sorting (Name / Size / Status). Includes Package Detail clipboard copy for Package ID and paths, downgrade warnings, skip-identical-versions batch toggle, and post-install auto-cleanup.

