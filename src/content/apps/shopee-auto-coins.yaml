faq:
  - q: { zh: 需要 Root 權限或開啟無障礙服務嗎？, en: Does ShopeeAutoCoins require Root or AccessibilityService? }
    a:
      zh: 兩者皆不需要。本專案完全不使用 AccessibilityService 亦不使用 DevicePolicyManager，推薦搭配免 Root 的 Shizuku 透過無線除錯授權即可實現簽到後自動熄屏；若裝置已 Root 亦支援 Magisk / KernelSU / APatch。
      en: Neither is required. ShopeeAutoCoins completely avoids AccessibilityService and DevicePolicyManager. Pairing with rootless Shizuku via Wireless Debugging enables automatic screen-off, while rooted devices (Magisk / KernelSU / APatch) are also supported via libsu.
  - q: { zh: 帳號與 Cookie 資料安全嗎？, en: Are my account and cookies safe? }
    a:
      zh: 本專案不含任何第三方統計或遠端上報程式碼，所有登入憑證皆透過 Android 原生 WebKit CookieManager 隔離儲存於本機應用程式私有目錄中。
      en: Yes. There are zero third-party analytics or remote telemetry. All login sessions and cookies remain isolated locally inside Android's native WebKit CookieManager.
  - q: { zh: 什麼是「防風控浮動時間」與「防 AOD 靜音推播」？, en: What are Anti-Risk-Control Random Jitter and Anti-AOD Silent Notifications? }
    a:
      zh: 「防風控浮動時間」可在排程時間後隨機延遲 0～30 分鐘執行，避免每天精確於同一秒簽到觸發平台異常偵測；「防 AOD 靜音推播（SILENT_AOD）」則讓簽到成功通知靜默收納於通知欄，不響鈴、不亮屏也不喚醒 Always-On Display，僅在異常或登入失效時警示。
      en: Random Jitter adds a random 0–30 minute delay after your scheduled time so check-ins never fire at the exact same second daily. SILENT_AOD silently stores success notifications in your shade without sound, screen wake, or triggering Always-On Display—only alerting you if an error or session expiry occurs.
  - q: { zh: 如何確認蝦皮或環境感測器運作是否正常？, en: How can I verify sensors, Shizuku, and check-in status? }
    a:
      zh: 您可在主頁「除錯與診斷中心」的三個分頁中，分別預覽靜音／惱人鬧鐘介面、觸發即時或 5 秒延遲測試簽到、即時採樣距離與光照 Lux 數值，並一鍵產生完整系統診斷報告複製分享。
      en: Open the 3-tab Developer Debug Dashboard to preview silent/annoying alarm UIs, trigger immediate or 5s delayed test check-ins, inspect live 300ms proximity/ambient light Lux snapshots, and copy a full diagnostic report in one tap.

