name: ShopeeAutoCoins
packageName: com.lnu.shopeeautocoins
icon: /apps/shopee-auto-coins/app-icon.webp
status: closed-beta
version: "2.0.2"                            # versionCode 30
minAndroid: "8.0"                            # minSdk 26
targetAndroid: "17 (API 37)"                 # targetSdk 37

tagline:
  zh: Android 智慧型每日蝦皮自動簽到賺蝦幣助手與獨立進階排程鬧鐘。
  en: Smart daily Shopee auto check-in assistant & independent scheduled alarm for Android.
description:
  zh: |
    ShopeeAutoCoins（蝦皮自動簽）是一款專為 Android 開發的自動化工具，結合了「蝦皮每日定時自動簽到」與「雙模式獨立排程鬧鐘」功能。
    整合 Shizuku（免 Root）與 Root（libsu）底層特權睡眠鍵控制（KEYCODE_SLEEP / KEYCODE_POWER），搭配 300ms 環境光與距離感測器防誤關保護，徹底擺脫傳統無障礙服務（AccessibilityService）與裝置管理員（DevicePolicyManager）容易觸發銀行類 App 警告、耗電與被系統清理的問題。
    內建兩步驟排程與防風控精靈（0–30 分鐘隨機浮動延遲、雙軌排程與防 AOD 靜音推播）及四模式動態 User-Agent 偽裝瀏覽器；全程運行於裝置本地，零第三方統計 SDK，所有 Cookie 與登入 Session 均隔離儲存於 Android 原生 WebView 沙箱中。
  en: |
    ShopeeAutoCoins is an Android automation tool combining scheduled daily Shopee coin check-ins with an independent dual-mode alarm system.
    By leveraging Shizuku (rootless, UID 2000) and Root (libsu) sleep-key events (KEYCODE_SLEEP / KEYCODE_POWER) paired with 300ms ambient light and proximity sensor protection, it completely avoids AccessibilityService and DevicePolicyManager—preventing battery drain, system kills, and banking app security warnings.
    Equipped with a 2-step anti-risk-control scheduling wizard (0–30m random jitter, hybrid dual scheduling, and anti-AOD silent notifications) plus a 4-mode dynamic User-Agent browser, it runs 100% locally with zero third-party analytics and keeps all cookies isolated inside Android's native WebView sandbox.

features:
  - title: { zh: 5 階段混合式每日自動簽到引擎, en: 5-Stage Hybrid Auto Check-In Engine }
    description:
      zh: 整合原生 WebView 沙箱與多路徑蝦皮 API 直連，透過 5 階段狀態機（載入、JS 注入、API 執行、異常重試、結果記錄）搭配 Mutex 併發鎖與 60 秒超時保護確保單次任務可靠執行，並保存完整本地簽到日誌。
      en: Combines a native WebView sandbox with multi-endpoint Shopee API execution via a 5-stage state machine (loading, JS injection, API execution, retry, completion), protected by a Mutex concurrency lock, 60s timeout guard, and local check-in logs.
  - title: { zh: 雙軌排程、防風控浮動與靜音防 AOD 推播, en: Dual Scheduling, Random Jitter & Anti-AOD Notifications }
    description:
      zh: 提供兩步驟設定精靈：支援 0–30 分鐘「防風控隨機浮動延遲」、三種觸發引擎（HYBRID 雙軌／ALARM 精確鬧鐘／WORK_MANAGER）與三種推播策略（SILENT_AOD 防喚醒 AOD 靜音推播、成功零通知、一般橫幅），且支援開機自動恢復。
      en: Guided 2-step scheduler with 0–30 min anti-risk-control random jitter, 3 trigger modes (HYBRID dual-track, ALARM, WORK_MANAGER), 3 result notification modes (SILENT_AOD to keep Always-On Display asleep, silent-on-success, or normal banner), and boot recovery.
  - title: { zh: Shizuku / Root 免無障礙特權熄屏, en: Shizuku & Root Privilege Sleep Control }
    description:
      zh: 零 AccessibilityService、零 DevicePolicyManager！自動採用 Shizuku API（推薦，透過無線除錯免 Root）或 Root（libsu）僅於螢幕點亮時發送底層 KEYCODE_SLEEP (223)／KEYCODE_POWER (26)，簽到完成後無痕休眠鎖屏。
      en: Zero AccessibilityService and zero DevicePolicyManager. Automatically dispatches KEYCODE_SLEEP (223) or KEYCODE_POWER (26) via Shizuku (rootless via Wireless Debugging) or Root (libsu) only when interactive, turning the screen off cleanly without triggering banking app alerts.
  - title: { zh: 300ms 雙感測器口袋與操作防誤關, en: 300ms Dual-Sensor Pocket & Usage Protection }
    description:
      zh: 熄屏前進行 300ms 快速非阻塞取樣，綜合距離感測器遮蔽、環境光感測器（< 15 Lux，無距離感測器之平板自動改採 < 2 Lux）與鎖定畫面狀態精準判斷：放於口袋或桌面時自動熄屏，若偵測正在使用手機則安全跳過。
      en: Runs a fast 300ms non-blocking sensor check combining proximity occlusion, ambient light (< 15 Lux, or < 2 Lux on tablets without proximity), and keyguard lock state—sleeping immediately in pockets/darkness while skipping if you are actively using the phone.
  - title: { zh: 獨立雙模式鬧鐘與桌面快捷捷徑, en: Independent Dual-Mode Alarm & App Shortcuts }
    description:
      zh: 採 Material 3 撥盤／鍵盤時間選擇與自訂重複週期，提供「靜音模式（5 秒自動關閉）」與「提示與震動模式（系統鈴聲分類挑選、震動與可調式 Snooze）」；另有簽到專屬全螢幕提醒與桌面動態快捷捷徑。
      en: Offers M3 dial/keyboard time picking and custom repeat schedules with Silent Mode (5s auto-dismiss) and Annoying Mode (system ringtone categories, vibration, and adjustable Snooze), plus a dedicated check-in reminder alarm and launcher app shortcuts.
  - title: { zh: 四模式動態 User-Agent 瀏覽器與三頁籤診斷, en: 4-Mode Dynamic UA Browser & 3-Tab Debug Suite }
    description:
      zh: 內建彈窗瀏覽器支援四種 UA（系統預設、CDN 即時更新 Chrome Mobile、自動爬蟲更新 Instagram Android、自訂字串）與 24 小時快取；三頁籤除錯儀表板提供鬧鐘測試、簽到模擬、即時感測器數據與一鍵複製完整診斷報告。
      en: Popup-enabled browser supports 4 UA modes (System Default, live-fetched Chrome Mobile, live-scraped Instagram Android, and Custom) with 24h caching. A 3-tab debug dashboard tests alarms, check-in runs, live sensors, and exports a one-tap diagnostic report.

