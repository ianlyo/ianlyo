name: Focus Log
packageName: com.ianlyo.focuslog
icon: ""
status: open-beta
version: "1.2.0"
minAndroid: "8.0"
targetAndroid: "16"

tagline:
  zh: 專為深度工作設計的番茄鐘與極簡習慣記錄器。
  en: Minimalist pomodoro and habit tracker built for deep work.
description:
  zh: |
    Focus Log 是一款遵循 Material 3 與離線優先原則的專注計時與習慣追蹤工具。
    提供沉浸式翻頁鐘介面、音效回饋以及詳細的每日生產力分佈圖表，幫助您在快節奏中維持心流狀態。
  en: |
    Focus Log is an offline-first productivity app built with Material 3.
    It combines a distraction-free flip clock timer with habit tracking and daily productivity heatmaps.

features:
  - title: { zh: 沉浸式翻頁鐘, en: Immersive Flip Clock }
    image: /og/default.png
    description:
      zh: 簡約乾淨的全螢幕專注計時介面，支援自訂工作與休息時長。
      en: Clean full-screen timer interface with customizable work and break intervals.
  - title: { zh: 每日心流趨勢熱力圖, en: Daily Flow Heatmap }
    image: /og/default.png
    description:
      zh: 像 GitHub Commit 般可視化你的專注時間，追蹤每週的成長軌跡。
      en: Visualize your deep work sessions like GitHub contributions over time.
  - title: { zh: 離線優先與隱私至上, en: Offline-First & Private }
    image: /og/default.png
    description:
      zh: 所有數據僅儲存於裝置本機 Room 資料庫，零帳號綁定、零追蹤代碼。
      en: All data stays locally in the device's Room database. No accounts, no telemetry.

screenshots:
  - src: /og/default.png
    alt: { zh: 計時主畫面, en: Timer screen }
  - src: /og/default.png
    alt: { zh: 趨勢分析圖, en: Analytics screen }

specs:
  - label: { zh: 架構模式, en: Architecture }
    value: MVI + Clean Architecture
  - label: { zh: 本地存儲, en: Local Storage }
    value: Room DB + DataStore
tech: [Kotlin, Jetpack Compose, Coroutines, Flow, Material 3]

faq:
  - q: { zh: 資料會上傳到雲端嗎？, en: Is my data uploaded to the cloud? }
    a: { zh: 完全不會。所有資料皆嚴格存於裝置內部，不需連網即可使用。, en: Never. All data is stored purely locally on your device. }
  - q: { zh: 支援自訂白噪音或音效嗎？, en: Are custom sound effects supported? }
    a: { zh: 支援內建多款白噪音（雨聲、篝火、咖啡廳環境音）。, en: Yes, built-in ambient white noises such as rain and cafe sounds are included. }

changelog:
  - version: "1.2.0"
    date: "2026-11-10"
    notes:
      - { zh: 新增 Material 3 動態配色支援, en: Added Material You dynamic theming }
      - { zh: 改善背景計時精準度, en: Improved background timer accuracy }
  - version: "1.0.0"
    date: "2026-10-15"
    notes:
      - { zh: 首次測試版發布, en: Initial beta release }

